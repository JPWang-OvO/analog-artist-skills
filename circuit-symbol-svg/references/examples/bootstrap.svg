<svg xmlns="http://www.w3.org/2000/svg" width="640" height="432" viewBox="0 0 640 432">
<title>Bootstrapped sampling switch</title>
<desc>Functional symbol of a bootstrapped sampling switch. Terminal order: VDD VSS CLK VIN VOUT BS_CTRL. Parallel bootstrap capacitors are represented by CBOOT. Phi equals CLK; phi switches conduct during tracking (CLK high); phi-bar switches conduct during precharge/hold (CLK low). Ideal switch glyphs summarize the transistor control network rather than reproducing individual MOS gate connections. During precharge the capacitor is charged between VDD and VSS, and BS_CTRL is discharged. During track its bottom follows VIN and its top drives BS_CTRL, the gate of the main sampling NMOS. Local ground references are VSS. NMOS body and protection/pump transistor details are omitted from this functional abstraction. VIN/VOUT form the pass path; BS_CTRL remains an exposed output.</desc>
<metadata>{"purpose":"Standalone visual example for circuit-symbol composition.","terminal_order":["VDD","VSS","CLK","VIN","VOUT","BS_CTRL"],"phase":"phi = CLK; high = track","capacitor":"CBOOT represents the parallel bootstrap capacitance","representation":"functional switched-capacitor equivalent"}</metadata>
<style>text{font-family:'DejaVu Sans',sans-serif;font-size:16px;fill:#287740}.wire{stroke:#425d4a;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}.shape{stroke:#287740;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}.contact{stroke:#425d4a;stroke-width:1.5;fill:white}.node{fill:#425d4a}.pin{fill:#c53e32}.portlabel{fill:#c53e32}.phase{text-anchor:middle}.bar{text-decoration:overline}</style>
