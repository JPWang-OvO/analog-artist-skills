  <title id="title">DIFFERENTIAL SAMPLER</title>
  <desc id="desc">Differential input/reference sampling onto two capacitors, common-mode clamps and top-plate equalization, followed by the three-stage comparator. The P and M signal and reference ports mirror about y=250. Short dashed control stubs with matching phi labels denote the same control net.</desc>
