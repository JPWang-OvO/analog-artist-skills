<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="444" viewBox="0 0 800 444" role="img" aria-labelledby="title description">
  <title id="title">REGISTER AND DELAY</title>
  <desc id="description">Functional circuit symbol. Seven rising-edge D flip-flops capture D into THERM. CLKD also drives a falling-edge validity flip-flop with its data tied high. Its active-low reset is RSTB AND CLKC. Its output passes through six inverters to CODE_VALID. RSTB directly resets the thermometer bank. Supply distribution is implicit, as for conventional logic-gate symbols. Junctions are marked with dots; the reset wire bridges the clock spine without connecting.</desc>
  <metadata>{"purpose": "Standalone visual example for circuit-symbol composition.", "display_ports": ["VDD", "VSS", "D&lt;6:0&gt;", "THERM&lt;6:0&gt;", "CLKD", "RSTB", "CLKC", "CODE_VALID"], "function": "Seven rising-edge flip-flops capture D into THERM and reset through RSTB. A falling-edge validity flip-flop has data tied high and active-low reset driven by RSTB AND CLKC. Six inverters delay its output to CODE_VALID."}</metadata>
  <defs>
    <style>
      text { font-family: Consolas, "Liberation Mono", monospace; }
      .name { fill: #216038; font-size: 19px; font-weight: 600; }
      .label { fill: #c83e32; font-size: 16px; }
      .logic-text { fill: #216038; font-size: 16px; }
      .small { fill: #216038; font-size: 16px; }
      .wire { fill: none; stroke: #405b47; stroke-width: 1.8; stroke-linejoin: round; stroke-linecap: square; }
      .bus { fill: none; stroke: #405b47; stroke-width: 2.4; }
      .gate { fill: white; stroke: #287740; stroke-width: 1.8; stroke-linejoin: round; }
      .dot { fill: #405b47; }
      .pin { fill: #df4638; }
    
.module{fill:none;stroke:#287740;stroke-width:1.4;stroke-linejoin:miter}</style>
    <g id="inverter">
      <path class="gate" d="M0 -12 L22 0 L0 12 Z" />
      <circle class="gate" cx="25.5" cy="0" r="3.5" />
    </g>
  </defs>
  <rect id="symbol-boundary" class="module" x="24" y="50" width="748" height="382" />
  <text class="name" x="400" y="27" text-anchor="middle" id="label-0">REGISTER AND DELAY</text>
  <g id="pin-vdd" data-port="VDD" data-role="power" data-side="top">
    <rect class="pin" x="396" y="46" width="8" height="8" />
    <path class="wire" d="M400 54 V82" />
    <text class="label" x="412" y="72" id="label-1">VDD</text>
  </g>
  <g id="pin-vss" data-port="VSS" data-role="ground" data-side="bottom">
    <rect class="pin" x="396" y="428" width="8" height="8" />
    <path class="wire" d="M400 400 V428" />
    <text class="label" x="412" y="420" id="label-2">VSS</text>
  </g>
  <g id="pin-d" data-port="D&lt;6:0&gt;" data-width="7" data-role="input" data-side="left">
    <rect class="pin" x="20" y="116" width="8" height="8" />
    <path class="bus" d="M28 120 H300 M260 126 L272 114" />
    <text class="label" x="40" y="109" id="label-3">D&lt;6:0&gt;</text>
    <text class="small" x="266" y="108" text-anchor="middle" id="label-4">7</text>
  </g>
  <g id="pin-therm" data-port="THERM&lt;6:0&gt;" data-width="7" data-role="output" data-side="right">
    <path class="bus" d="M388 120 H768 M416 126 L428 114" />
    <rect class="pin" x="768" y="116" width="8" height="8" />
    <text class="label" x="756" y="109" text-anchor="end" id="label-5">THERM&lt;6:0&gt;</text>
    <text class="small" x="422" y="108" text-anchor="middle" id="label-6">7</text>
  </g>
  <g id="pin-clkd" data-port="CLKD" data-role="input" data-side="left">
    <rect class="pin" x="20" y="160" width="8" height="8" />
    <path class="wire" d="M28 164 H300 M224 164 V316 H292" />
    <circle class="dot" cx="224" cy="164" r="3.1" />
    <text class="label" x="40" y="153" id="label-7">CLKD</text>
  </g>
  <g id="pin-rstb" data-port="RSTB" data-role="input" data-active-level="low" data-side="left">
    <rect class="pin" x="20" y="220" width="8" height="8" />
    <path class="wire" d="M28 224 H216 M232 224 H344 V198 M164 224 V378 H190" />
    <path d="M216 224 A8 8 0 0 1 232 224" fill="none" stroke="white" stroke-width="6" />
    <path class="wire" d="M216 224 A8 8 0 0 1 232 224" />
    <circle class="dot" cx="164" cy="224" r="3.1" />
    <text class="label" x="40" y="213" id="label-8">RSTB</text>
  </g>
  <g id="therm-register-bank" data-instances="XTHERM6 XTHERM5 XTHERM4 XTHERM3 XTHERM2 XTHERM1 XTHERM0">
    <rect class="gate" x="300" y="90" width="88" height="100" />
    <path class="wire" d="M300 156 L312 164 L300 172" />
    <circle class="gate" cx="344" cy="194" r="4" />
    <text class="logic-text" x="344" y="141" text-anchor="middle" id="label-9">×7</text>
  </g>
  <path id="valid-data-high" class="wire" d="M268 267 V284 H300 M262 267 H274" />
  <g id="valid-register" data-instances="XCLKDB XVALID">
    <rect class="gate" x="300" y="260" width="88" height="90" />
    <circle class="gate" cx="296" cy="316" r="4" />
    <path class="wire" d="M300 308 L312 316 L300 324" />
    <circle class="gate" cx="344" cy="354" r="4" />
  </g>
  <g id="pin-clkc" data-port="CLKC" data-role="input" data-side="left">
    <rect class="pin" x="20" y="402" width="8" height="8" />
    <path class="wire" d="M28 406 H190" />
    <text class="label" x="40" y="395" id="label-10">CLKC</text>
  </g>
  <g id="valid-reset-and" data-instance="XVALID_RESET">
    <path class="gate" d="M190 364 H216 A28 28 0 0 1 216 420 H190 Z" />
    <path class="wire" d="M244 392 H344 V358" />
  </g>
  <g id="valid-delay-chain">
    <path class="wire" d="M388 284 H430 M459 284 H466 M495 284 H502 M531 284 H538 M567 284 H574 M603 284 H610 M639 284 H768" />
    <use href="#inverter" transform="translate(430 284)" data-instance="XVALID_DELAY0" />
    <use href="#inverter" transform="translate(466 284)" data-instance="XVALID_DELAY1" />
    <use href="#inverter" transform="translate(502 284)" data-instance="XVALID_DELAY2" />
    <use href="#inverter" transform="translate(538 284)" data-instance="XVALID_DELAY3" />
    <use href="#inverter" transform="translate(574 284)" data-instance="XVALID_DELAY4" />
    <use href="#inverter" transform="translate(610 284)" data-instance="XVALID_DELAY5" />
  </g>
  <g id="pin-code-valid" data-port="CODE_VALID" data-role="output" data-side="right">
    <rect class="pin" x="768" y="280" width="8" height="8" />
    <text class="label" x="756" y="273" text-anchor="end" id="label-11">CODE_VALID</text>
  </g>
</svg>