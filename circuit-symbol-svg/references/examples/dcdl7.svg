.port{fill:#c53e32}.wire,.gate,.body{fill:none;stroke:#287740;stroke-width:1.6;stroke-linejoin:round}
.bus{fill:none;stroke:#425d4a;stroke-width:3.2;stroke-linejoin:round}.dot,.flow{fill:#425d4a;stroke:none}
.circle{fill:white;stroke:#287740;stroke-width:1.6}.pin{fill:#c53e32;stroke:none}</style>
  <rect x="32" y="96" width="576" height="256" class="body" />
  <text x="320.0" y="32" text-anchor="middle" class="">CLK_DCDL7</text>
  <text x="32" y="64" text-anchor="start" class="">I0</text>
  <g data-port="I" data-side="left" data-direction="input">
