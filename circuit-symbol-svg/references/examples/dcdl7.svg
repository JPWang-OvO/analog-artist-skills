<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="416" viewBox="0 0 640 416">
  <title>CLK_DCDL7</title>
  <desc>Seven cascaded binary-weighted delay/bypass stages, controlled by C&lt;0:6&gt;. RN clears every stage and qualifies the output. Delay weights are 1,2,4,8,16,32,64.</desc>
